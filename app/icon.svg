<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- فم بانک — جلسه ۲۹: مربع گرد مشکی + خانه قرمز ملایم + حرف F مشکی ظریف؛
     همان طرح HouseLogo.tsx با scale(0.125) — برای بازتولید: logo_design_v2.py -->
  <g transform="scale(0.125)">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#2B2B31"/>
          <stop offset="1" stop-color="#0D0D11"/>
        </linearGradient>
        <radialGradient id="amb" cx="0.5" cy="0.46" r="0.62">
          <stop offset="0" stop-color="#C2473C" stop-opacity="0.20"/>
          <stop offset="1" stop-color="#C2473C" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="house" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#D4726A"/>
          <stop offset="1" stop-color="#AD4438"/>
        </linearGradient>
        <clipPath id="sq"><rect width="512" height="512" rx="118"/></clipPath>
      </defs>
    
      <!-- مربع مشکی -->
      <rect width="512" height="512" rx="118" fill="url(#bg)"/>
      <g clip-path="url(#sq)">
        <rect width="512" height="512" fill="url(#amb)"/>
      </g>
      <rect x="13" y="13" width="486" height="486" rx="107" fill="none" stroke="#ffffff" stroke-opacity="0.10" stroke-width="3"/>
    
      <!-- بازتاب قرمز ملایم کف -->
      <ellipse cx="258" cy="446" rx="168" ry="20" fill="#C2473C" opacity="0.10"/>
      <ellipse cx="256" cy="442" rx="132" ry="15" fill="#C2473C" opacity="0.12"/>
    
      <!-- لایه عمق سه‌بعدی (راست/پایین) -->
      <path d="M128 272 L268 126 L408 272 Z" fill="#7E2F27" stroke="#7E2F27" stroke-width="24" stroke-linejoin="round"/>
      <rect x="150" y="260" width="236" height="176" rx="24" fill="#7E2F27"/>
    
      <!-- خانه جلو — بزرگ‌تر از نسخه قبل -->
      <rect x="138" y="244" width="236" height="176" rx="24" fill="url(#house)"/>
      <path d="M116 256 L256 110 L396 256 Z" fill="url(#house)" stroke="url(#house)" stroke-width="24" stroke-linejoin="round"/>
    
      <!-- هایلایت سفالین شیب چپ بام -->
      <path d="M152 240 L256 134" fill="none" stroke="#FFEDE9" stroke-opacity="0.55" stroke-width="5" stroke-linecap="round"/>
    
      <!-- حرف F مشکی — کوچک‌تر و ظریف -->
      <g stroke="#131318" stroke-width="15" stroke-linecap="round" fill="none">
        <path d="M234 290 L234 368"/>
        <path d="M234 290 L290 290"/>
        <path d="M234 326 L278 326"/>
      </g>
  </g>
</svg>
