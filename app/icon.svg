<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
<!-- فم بانک — جلسه ۳۰: مربع گرد سرمه‌ای عمیق + خانه درخشان فیروزه‌ای→آبی الکتریک
     + سقف سفید براق + حرف F بزرگ سرمه‌ای؛ همان طرح HouseLogo.tsx با scale(0.125)
     — برای بازتولید: logo_design_v3.py و build_logo_assets_v3.py -->
  <g transform="scale(0.125)">
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#212F5A"/>
          <stop offset="0.5" stop-color="#0F1B3D"/>
          <stop offset="1" stop-color="#060C1F"/>
        </linearGradient>
        <radialGradient id="glow" cx="0.5" cy="0.5" r="0.62">
          <stop offset="0" stop-color="#26E5D3" stop-opacity="0.26"/>
          <stop offset="0.55" stop-color="#1E82D8" stop-opacity="0.10"/>
          <stop offset="1" stop-color="#1E82D8" stop-opacity="0"/>
        </radialGradient>
        <radialGradient id="toplight" cx="0.24" cy="0.10" r="0.55">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.08"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="vig" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0.55" stop-color="#04081A" stop-opacity="0"/>
          <stop offset="1" stop-color="#04081A" stop-opacity="0.45"/>
        </linearGradient>
        <linearGradient id="body" x1="150" y1="250" x2="380" y2="430" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#45F5DC"/>
          <stop offset="0.5" stop-color="#1FC9E4"/>
          <stop offset="1" stop-color="#2B66F0"/>
        </linearGradient>
        <linearGradient id="roof" x1="256" y1="98" x2="256" y2="268" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#FFFFFF"/>
          <stop offset="1" stop-color="#C9E2F8"/>
        </linearGradient>
        <linearGradient id="shine" x1="152" y1="240" x2="256" y2="134" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#ffffff" stop-opacity="0.95"/>
          <stop offset="1" stop-color="#ffffff" stop-opacity="0.15"/>
        </linearGradient>
        <linearGradient id="f" x1="226" y1="282" x2="226" y2="398" gradientUnits="userSpaceOnUse">
          <stop offset="0" stop-color="#17345E"/>
          <stop offset="1" stop-color="#0A1B36"/>
        </linearGradient>
        <clipPath id="sq"><rect width="512" height="512" rx="118"/></clipPath>
        <clipPath id="bodyclip"><rect x="138" y="244" width="236" height="176" rx="24"/></clipPath>
      </defs>
    
      <!-- مربع گرد سرمه‌ای عمیق + نورپردازی استودیویی (هاله نئون، نور بالا-چپ، وینیت) -->
      <rect width="512" height="512" rx="118" fill="url(#bg)"/>
      <g clip-path="url(#sq)">
        <rect width="512" height="512" fill="url(#glow)"/>
        <rect width="512" height="512" fill="url(#toplight)"/>
        <rect width="512" height="512" fill="url(#vig)"/>
      </g>
      <rect x="13" y="13" width="486" height="486" rx="107" fill="none" stroke="#BFDFFF" stroke-opacity="0.14" stroke-width="3"/>
    
      <!-- بازتاب نئون کف + سایه نرم واقعی زیر خانه -->
      <ellipse cx="262" cy="436" rx="178" ry="26" fill="#2BE4D6" opacity="0.13"/>
      <ellipse cx="260" cy="432" rx="140" ry="19" fill="#2BE4D6" opacity="0.16"/>
      <ellipse cx="264" cy="438" rx="152" ry="18" fill="#01050F" opacity="0.45"/>
      <ellipse cx="262" cy="434" rx="122" ry="14" fill="#01050F" opacity="0.5"/>
      <ellipse cx="260" cy="430" rx="94" ry="11" fill="#01050F" opacity="0.55"/>
    
      <!-- لایه عمق سه‌بعدی (جابه‌جایی راست/پایین) -->
      <path d="M128 272 L268 126 L408 272 Z" fill="#0D5878" stroke="#0D5878" stroke-width="24" stroke-linejoin="round"/>
      <rect x="150" y="260" width="236" height="176" rx="24" fill="#0D5878"/>
    
      <!-- خانه جلو — بدنه گرادیانت درخشان با لبه شیشه‌ای -->
      <rect x="138" y="244" width="236" height="176" rx="24" fill="url(#body)" stroke="#DFF9FF" stroke-opacity="0.3" stroke-width="2"/>
      <g clip-path="url(#bodyclip)">
        <path d="M196 244 L252 244 L156 420 L100 420 Z" fill="#ffffff" opacity="0.10"/>
        <path d="M292 244 L318 244 L222 420 L196 420 Z" fill="#ffffff" opacity="0.07"/>
      </g>
    
      <!-- سقف سفید براق + هایلایت شیپ چپ -->
      <path d="M116 256 L256 110 L396 256 Z" fill="url(#roof)" stroke="url(#roof)" stroke-width="24" stroke-linejoin="round"/>
      <path d="M152 240 L256 134" fill="none" stroke="url(#shine)" stroke-width="6" stroke-linecap="round"/>
    
      <!-- حرف F بزرگ در مرکز خانه -->
      <g stroke="url(#f)" stroke-width="22" stroke-linecap="round" fill="none">
        <path d="M226 282 L226 398"/>
        <path d="M226 282 L308 282"/>
        <path d="M226 334 L290 334"/>
      </g>
  </g>
</svg>
